<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hyperverse-4D | Dynamic Multiplayer 4D Arena</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; user-select: none; }
    body { background: #05070d; color: #e2e8f0; overflow: hidden; touch-action: none; }
    canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
    canvas:active { cursor: grabbing; }
    #hud { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; font-size: 12px; }
    .panel { background: rgba(15, 23, 42, 0.82); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 10px; padding: 9px 12px; backdrop-filter: blur(6px); pointer-events: auto; }
    .row { display: flex; gap: 6px; align-items: center; margin-top: 5px; }
    input { background: #0f172a; color: #e2e8f0; border: 1px solid #334155; border-radius: 6px; padding: 4px 7px; font-size: 11px; width: 88px; }
    #radar { position: fixed; right: 14px; top: 155px; width: 34px; height: 210px; background: rgba(15, 23, 42, 0.85); border: 1px solid #38bdf8; border-radius: 17px; }
    #radar-label { position: fixed; right: 10px; top: 138px; font-size: 10px; font-weight: 700; color: #38bdf8; }
    #feed { position: fixed; left: 12px; bottom: 112px; max-width: 260px; font-size: 11px; color: #94a3b8; pointer-events: none; line-height: 1.4; }
    #dpad { position: fixed; left: 14px; bottom: 14px; display: grid; grid-template-columns: repeat(3, 38px); gap: 4px; }
    #controls { position: fixed; bottom: 14px; right: 14px; left: 142px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
    button { background: rgba(30, 41, 59, 0.92); color: #38bdf8; border: 1px solid #38bdf8; border-radius: 8px; padding: 8px 10px; font-weight: 600; font-size: 11px; cursor: pointer; }
    button:active { background: #38bdf8; color: #05070d; }
    #fireBtn { border-color: #f43f5e; color: #fb7185; }
    #fireBtn:active { background: #f43f5e; color: #fff; }
    #pingBtn { border-color: #a855f7; color: #c084fc; }
    #lbList { margin-top: 4px; color: #94a3b8; font-size: 11px; line-height: 1.35; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="panel">
      <div><strong>HYPERVERSE-4D</strong> • <span id="coords">0.0, 0.0, 0.0, W:0.0</span></div>
      <div class="row">
        <input id="nameInput" maxlength="14" placeholder="Callsign" />
        <input id="shardInput" maxlength="18" placeholder="Shard" />
        <button id="joinBtn">Join</button>
      </div>
      <div style="color:#94a3b8;margin-top:4px;font-size:11px;">
        <span style="color:#34d399">◆ Crystal (+5)</span> •
        <span style="color:#c084fc">◎ 2P Beacon (+25)</span> •
        <span style="color:#fb7185">● Pulse (+10)</span>
      </div>
    </div>
    <div class="panel" style="text-align:right; min-width: 145px;">
      <div>Score: <strong id="score" style="color:#38bdf8">0</strong> • Online: <strong id="online" style="color:#34d399">1</strong></div>
      <div id="lbList">Connecting...</div>
    </div>
  </div>

  <div id="radar-label">W-SONAR</div>
  <canvas id="radar" width="34" height="210"></canvas>
  <div id="feed"></div>

  <div id="dpad">
    <div></div><button id="btnUp">▲</button><div></div>
    <button id="btnLeft">◀</button><button id="btnDown">▼</button><button id="btnRight">▶</button>
  </div>

  <div id="controls">
    <button onpointerdown="rot.xw += 0.25">XW+ (R)</button>
    <button onpointerdown="rot.xw -= 0.25">XW- (F)</button>
    <button onpointerdown="rot.zw += 0.25">ZW+ (T)</button>
    <button onpointerdown="rot.zw -= 0.25">ZW- (G)</button>
    <button onpointerdown="me.w = Math.max(-8, me.w - 0.5)">W- (Q)</button>
    <button onpointerdown="me.w = Math.min(8, me.w + 0.5)">W+ (E)</button>
    <button id="pingBtn" onpointerdown="sendPing()">PING (C)</button>
    <button id="fireBtn" onpointerdown="firePulse()">4D PULSE (SPACE)</button>
  </div>

  <script type="module">
    import { Vec4, rotate4D, project4Dto2D } from "./engine/math4d.js";

    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const rCanvas = document.getElementById("radar");
    const rCtx = rCanvas.getContext("2d");

    const params = new URLSearchParams(location.search);
    let shard = params.get("shard") || "global-alpha";
    const myId = localStorage.getItem("hv4d_id") || ("P-" + Math.random().toString(36).slice(2, 6).toUpperCase());
    localStorage.setItem("hv4d_id", myId);
    let myName = localStorage.getItem("hv4d_name") || myId;

    document.getElementById("nameInput").value = myName;
    document.getElementById("shardInput").value = shard;

    const me = { id: myId, name: myName, x: 0, y: 0, z: 0, w: 0, score: 0 };
    const rot = { xy: 0, xz: 0.35, yz: 0.22, xw: 0, yw: 0, zw: 0 };
    let remotePlayers = [];
    let crystals = [];
    let beacons = [];
    let activePulses = [];
    let activePings = [];
    let tethers = [];

    const tesseractVerts = [];
    for (let i = 0; i < 16; i++) {
      tesseractVerts.push(new Vec4(
        (i & 1 ? 3 : -3),
        (i & 2 ? 3 : -3),
        (i & 4 ? 3 : -3),
        (i & 8 ? 3 : -3)
      ));
    }
    const tesseractEdges = [];
    for (let i = 0; i < 16; i++) {
      for (let bit = 1; bit < 16; bit <<= 1) {
        if ((i & bit) === 0) tesseractEdges.push([i, i | bit]);
      }
    }

    let ws;
    function connect() {
      if (ws) { ws.onclose = null; ws.close(); }
      const wsUrl = `wss://hyperverse-4d-shard.richmondbawuah1.workers.dev/?shard=${encodeURIComponent(shard)}&id=${encodeURIComponent(myId)}&name=${encodeURIComponent(myName)}`;
      ws = new WebSocket(wsUrl);
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === "state") {
          remotePlayers = msg.players || [];
          crystals = msg.crystals || [];
          beacons = msg.beacons || [];
          activePulses = msg.pulses || [];
          activePings = msg.pings || [];
          tethers = msg.tethers || [];

          const selfServer = remotePlayers.find(p => p.id === myId);
          if (selfServer) {
            me.score = selfServer.score;
            if (Math.abs(selfServer.w - me.w) > 1.8) me.w = selfServer.w;
          }
          document.getElementById("score").textContent = me.score;
          document.getElementById("online").textContent = remotePlayers.length;
          if (msg.leaderboard?.length) {
            document.getElementById("lbList").innerHTML = msg.leaderboard
              .map((r, idx) => `#${idx + 1} ${r.player_id}: <strong>${r.score}</strong>`)
              .join("<br>");
          }
          if (msg.feed?.length) {
            document.getElementById("feed").innerHTML = msg.feed.map(f => `• ${f.text}`).join("<br>");
          }
        }
      };
      ws.onclose = () => setTimeout(connect, 1500);
    }
    connect();

    document.getElementById("joinBtn").onclick = () => {
      myName = document.getElementById("nameInput").value.trim() || myId;
      shard = document.getElementById("shardInput").value.trim() || "global-alpha";
      localStorage.setItem("hv4d_name", myName);
      history.replaceState(null, "", `?shard=${encodeURIComponent(shard)}`);
      connect();
    };

    let dragging = false, lastX = 0, lastY = 0;
    canvas.addEventListener("pointerdown", (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
    window.addEventListener("pointerup", () => dragging = false);
    window.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      rot.xz += (e.clientX - lastX) * 0.008;
      rot.yz += (e.clientY - lastY) * 0.008;
      lastX = e.clientX;
      lastY = e.clientY;
    });

    window.rot = rot;
    window.me = me;
    window.firePulse = () => { if (ws?.readyState === 1) ws.send(JSON.stringify({ type: "pulse" })); };
    window.sendPing = () => { if (ws?.readyState === 1) ws.send(JSON.stringify({ type: "ping" })); };

    const keys = {};
    const bindHold = (id, code) => {
      const el = document.getElementById(id);
      el.addEventListener("pointerdown", () => keys[code] = true);
      el.addEventListener("pointerup", () => keys[code] = false);
      el.addEventListener("pointerleave", () => keys[code] = false);
    };
    bindHold("btnUp", "ArrowUp");
    bindHold("btnDown", "ArrowDown");
    bindHold("btnLeft", "ArrowLeft");
    bindHold("btnRight", "ArrowRight");

    window.addEventListener("keydown", (e) => {
      if (document.activeElement?.tagName === "INPUT") return;
      keys[e.code] = true;
      if (e.code === "Space") { e.preventDefault(); window.firePulse(); }
      if (e.code === "KeyC") window.sendPing();
    });
    window.addEventListener("keyup", (e) => keys[e.code] = false);

    setInterval(() => {
      if (ws?.readyState === 1) {
        ws.send(JSON.stringify({ type: "move", x: me.x, y: me.y, z: me.z, w: me.w }));
      }
    }, 50);

    function frame(t) {
      canvas.width = innerWidth;
      canvas.height = innerHeight;

      const spd = 0.08;
      if (keys.KeyW || keys.ArrowUp) me.z = Math.min(4.2, me.z + spd);
      if (keys.KeyS || keys.ArrowDown) me.z = Math.max(-4.2, me.z - spd);
      if (keys.KeyA || keys.ArrowLeft) me.x = Math.max(-4.2, me.x - spd);
      if (keys.KeyD || keys.ArrowRight) me.x = Math.min(4.2, me.x + spd);
      if (keys.KeyQ) me.w = Math.max(-8, me.w - 0.06);
      if (keys.KeyE) me.w = Math.min(8, me.w + 0.06);
      if (keys.KeyR) rot.xw += 0.025;
      if (keys.KeyF) rot.xw -= 0.025;
      if (keys.KeyT) rot.zw += 0.025;
      if (keys.KeyG) rot.zw -= 0.025;

      document.getElementById("coords").textContent = `${me.x.toFixed(1)}, ${me.z.toFixed(1)}, W:${me.w.toFixed(1)}`;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2, cy = canvas.height / 2;

      // 1. Tesseract Wireframe
      const projVerts = tesseractVerts.map(v => project4Dto2D(rotate4D(v, rot), me.w));
      ctx.strokeStyle = "rgba(56, 189, 248, 0.24)";
      ctx.lineWidth = 1.5;
      for (const [a, b] of tesseractEdges) {
        const p1 = projVerts[a], p2 = projVerts[b];
        if (!p1.visible && !p2.visible) continue;
        ctx.beginPath();
        ctx.moveTo(cx + p1.x, cy + p1.y);
        ctx.lineTo(cx + p2.x, cy + p2.y);
        ctx.stroke();
      }

      // 2. Multi-Player Resonance Beacons (Co-Op Nodes)
      for (const b of beacons) {
        const p = project4Dto2D(rotate4D(new Vec4(b.x, b.y, b.z, b.w), rot), me.w);
        if (!p.visible) continue;
        const alpha = Math.max(0.2, 1 - Math.abs(p.relW) / 6.5);
        const rad = Math.max(14, p.scale * 0.45);
        ctx.strokeStyle = `rgba(192, 132, 252, ${alpha})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx + p.x, cy + p.y, rad, 0, Math.PI * 2);
        ctx.stroke();
        if (b.charge > 0) {
          ctx.strokeStyle = "#e879f9";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(cx + p.x, cy + p.y, rad + 4, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * b.charge) / 100);
          ctx.stroke();
        }
        ctx.fillStyle = `rgba(192, 132, 252, ${alpha})`;
        ctx.font = "10px sans-serif";
        ctx.fillText(`${b.id} [${b.linked}/2P] W:${b.w.toFixed(1)}`, cx + p.x - 24, cy + p.y - rad - 6);
      }

      // 3. Collectible 4D Crystals
      const pulseSize = 1 + Math.sin(t * 0.006) * 0.2;
      for (const c of crystals) {
        const p = project4Dto2D(rotate4D(new Vec4(c.x, c.y, c.z, c.w), rot), me.w);
        if (!p.visible) continue;
        const alpha = Math.max(0.15, 1 - Math.abs(p.relW) / 6.5);
        const r = Math.max(5, p.scale * 0.16 * pulseSize);
        ctx.fillStyle = `rgba(52, 211, 153, ${alpha})`;
        ctx.beginPath();
        ctx.moveTo(cx + p.x, cy + p.y - r);
        ctx.lineTo(cx + p.x + r, cy + p.y);
        ctx.lineTo(cx + p.x, cy + p.y + r);
        ctx.lineTo(cx + p.x - r, cy + p.y);
        ctx.closePath();
        ctx.fill();
      }

      // 4. Spatial Pings
      for (const ping of activePings) {
        const p = project4Dto2D(rotate4D(new Vec4(ping.x, ping.y, ping.z, ping.w), rot), me.w);
        if (!p.visible) continue;
        const ring = ((70 - ping.ttl) % 25) * 2.2;
        ctx.strokeStyle = "rgba(168, 85, 247, 0.75)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx + p.x, cy + p.y, ring, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = "#d8b4fe";
        ctx.font = "11px sans-serif";
        ctx.fillText(`PING: ${ping.ownerName} (W:${ping.w.toFixed(1)})`, cx + p.x + 8, cy + p.y - 8);
      }

      // 5. Combat Pulses
      for (const pulse of activePulses) {
        const p = project4Dto2D(rotate4D(new Vec4(pulse.x, pulse.y, pulse.z, pulse.w), rot), me.w);
        if (!p.visible) continue;
        const alpha = Math.max(0, 1 - Math.abs(p.relW) / 6.5);
        ctx.strokeStyle = `rgba(244, 63, 94, ${alpha})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(cx + p.x, cy + p.y, pulse.r * p.scale * 0.4, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 6. Players & Dynamic Proximity Phase-Tethers
      const list = remotePlayers.length ? remotePlayers : [me];
      const projectedMap = new Map();
      for (const pl of list) {
        const pos = pl.id === myId ? me : pl;
        const p = project4Dto2D(rotate4D(new Vec4(pos.x, pos.y, pos.z, pos.w), rot), me.w);
        projectedMap.set(pl.id, { pl, pos, p });
      }

      for (const tether of tethers) {
        const A = projectedMap.get(tether.a), B = projectedMap.get(tether.b);
        if (!A || !B || (!A.p.visible && !B.p.visible)) continue;
        ctx.strokeStyle = `rgba(250, 204, 21, ${0.25 + tether.strength * 0.6})`;
        ctx.lineWidth = 1.5 + tether.strength * 2;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(cx + A.p.x, cy + A.p.y);
        ctx.lineTo(cx + B.p.x, cy + B.p.y);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      for (const { pl, pos, p } of projectedMap.values()) {
        if (!p.visible) continue;
        const alpha = Math.max(0.15, 1 - Math.abs(p.relW) / 6.5);
        ctx.fillStyle = pl.id === myId ? `rgba(56, 189, 248, ${alpha})` : `rgba(250, 204, 21, ${alpha})`;
        ctx.beginPath();
        ctx.arc(cx + p.x, cy + p.y, Math.max(6, p.scale * 0.22), 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = "11px sans-serif";
        ctx.fillText(`${pl.name || pl.id} (W:${pos.w.toFixed(1)})`, cx + p.x + 10, cy + p.y);
      }

      // 7. W-SONAR (Players, Crystals & Co-Op Beacons across W = -8 to +8)
      rCtx.clearRect(0, 0, 34, 210);
      rCtx.strokeStyle = "rgba(56, 189, 248, 0.4)";
      rCtx.beginPath(); rCtx.moveTo(0, 105); rCtx.lineTo(34, 105); rCtx.stroke();
      for (const b of beacons) {
        const y = 105 - (b.w / 8) * 90;
        rCtx.strokeStyle = "#c084fc";
        rCtx.lineWidth = 2;
        rCtx.beginPath(); rCtx.arc(17, y, 6, 0, Math.PI * 2); rCtx.stroke();
      }
      for (const c of crystals) {
        const y = 105 - (c.w / 8) * 90;
        rCtx.fillStyle = "#34d399";
        rCtx.fillRect(14, y - 3, 6, 6);
      }
      for (const pl of list) {
        const pos = pl.id === myId ? me : pl;
        const y = 105 - (pos.w / 8) * 90;
        rCtx.fillStyle = pl.id === myId ? "#38bdf8" : "#facc15";
        rCtx.beginPath();
        rCtx.arc(17, y, pl.id === myId ? 6 : 5, 0, Math.PI * 2);
        rCtx.fill();
      }

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
